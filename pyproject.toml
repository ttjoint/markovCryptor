[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markovcryptor"
version = "0.3.5"
description = "多信道隐写加解密平台：中文文本、静态图、动图"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ttjoint", email = "bignesslaski@gmail.com" }]

# Runtime deps mirror what the channel kernels actually import.  Kept as lower
# bounds rather than pins: the kernels use no recently-added APIs, and pinning
# would fight any host project that already has these installed.
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "reedsolo>=1.7",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# Web API + Web UI (docs/ARCHITECTURE.md §6). ``websockets`` is used by the
# OneBot client that connects the terminal to QQ.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]
# Video / stream channels are out of scope for now (ARCHITECTURE.md decision 3).
# Listed so the eventual work does not have to rediscover the choice.
media = [
    "opencv-python>=4.9",
    "av>=12.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
markovcryptor = "markovcryptor.cli:main"

[tool.setuptools.packages.find]
include = ["markovcryptor*"]

# The UIs are single static files; without this they are left out of the wheel
# and every installed copy returns 404 on ``/``. Both are listed: ``webui`` is
# the steganography workbench and the alice/bob demo, ``client/webui`` is the
# chat client. Missing the second one ships a package whose window is blank,
# which looks like a JavaScript bug and is actually a packaging one.
[tool.setuptools.package-data]
# **子目录必须显式列出**：setuptools 的 ``dir/*.ext`` 不递归。
#
# 踩过：拆分前端之后 ``client/webui`` 变成 index.html + js/ + css/ 共 23 个
# 文件，但这里还只写着 ``client/webui/*.html`` —— 打出来的包只有 HTML，
# 装上去整页空白。浏览器里表现为 JavaScript 报错，其实是打包漏了文件，
# 极难从现象反推。
markovcryptor = [
    "webui/*.html",
    "client/webui/*.html",
    "client/webui/js/*.js",
    "client/webui/js/core/*.js",
    "client/webui/js/views/*.js",
    "client/webui/js/panels/*.js",
    "client/webui/css/*.css",
    "covers/*.jpg",
]

# The suite is stdlib unittest, so configure nothing for pytest beyond the path:
# it is optional (see [project.optional-dependencies].dev) for anyone who wants it.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 打包验证会真的联网下载多个 Python 版本的 wheel（单条 196 秒，占全量
# 三分之二）。日常开发不需要它；发版前用 `-m slow` 单独跑。
markers = [
    "slow: 会联网或真打包的测试，默认跳过（用 -m slow 运行）",
]
addopts = "-m 'not slow'"
